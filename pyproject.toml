[project]
name = "jarvis"
version = "0.1.0"
description = "Central Interface — personal ops deck and agentic assistant hub."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "ollama>=0.6.2",
]

[project.scripts]
jarvis = "backend.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "black>=24",
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "httpx>=0.27",
    "httpx2>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]
